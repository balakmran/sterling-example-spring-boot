openapi: 3.0.3
info:
  title: Books
  version: 1.0.0
paths:
  /books:
    get:
      tags: [books]
      operationId: listBooks
      responses:
        "200":
          description: Every book in the catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"
    post:
      tags: [books]
      operationId: addBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "201":
          description: The book was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
  /books/{isbn}:
    get:
      tags: [books]
      operationId: getBook
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "404":
          description: No such book
components:
  schemas:
    BookRequest:
      type: object
      required: [isbn, title]
      properties:
        isbn:
          type: string
        title:
          type: string
        subtitle:
          type: string
    BookResponse:
      type: object
      required: [isbn, title]
      properties:
        isbn:
          type: string
        title:
          type: string
        subtitle:
          type: string
